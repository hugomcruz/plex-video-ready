name: Build Dist Server and Push to Harbor

on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - main
  #  paths:
  #     - "dist-server/**"

env:
  REGISTRY: harbor.bnov.net
  FULL_IMAGE: harbor.bnov.net/plex-video-ready/dist-server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./dist-server
          file: ./dist-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FULL_IMAGE }}:build-${{ github.run_number }}
            ${{ env.FULL_IMAGE }}:latest

name: Build Transcoder and Push to Harbor

on:
  workflow_dispatch:

env:
  REGISTRY: harbor.bnov.net
  FULL_IMAGE: harbor.bnov.net/plex-video-ready/transcoder

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./transcoder
          file: ./transcoder/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: |
            ${{ env.FULL_IMAGE }}:build-${{ github.run_number }}
            ${{ env.FULL_IMAGE }}:latest

      - name: Verify Docker manifest format
        run: |
          docker buildx imagetools inspect --raw \
            "${{ env.FULL_IMAGE }}:latest" \
            | jq -e '.mediaType == "application/vnd.docker.distribution.manifest.v2+json"'

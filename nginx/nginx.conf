server {
    listen 80;

    # Use Docker's embedded DNS so upstreams are resolved lazily (per-request)
    # rather than at startup — avoids "host not found" when containers start in parallel.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow large uploads through the proxy
    client_max_body_size 50G;

    # Proxy API calls to main-backend (strip /api/ prefix)
    location /api/ {
        set $backend http://main-backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy dist calls to external distribution server (strip /dist/ prefix)
    location /dist/ {
        set $dist https://plex.berzuk.com;
        rewrite ^/dist/(.*)$ /$1 break;
        proxy_pass $dist;
        proxy_set_header Host plex.berzuk.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static UI (served by the ui container)
    location / {
        set $ui http://ui:80;
        proxy_pass $ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
